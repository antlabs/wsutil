name: NEON (darwin/arm64, opt-in)

# mask 的 NEON 实现受 `darwin && arm64 && wsutil_neon` 构建约束保护,
# 默认构建不会编译到它。如果没有这个 job, 那份汇编会随着时间腐化而无人察觉。
#
# macos-14 是 Apple Silicon (arm64) runner; macos-13 是 Intel, 必须显式指定。

on:
  push:
  pull_request:

jobs:
  neon:
    runs-on: macos-14
    name: wsutil_neon on ${{ matrix.go }}
    strategy:
      matrix:
        go: ['1.21', '1.22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: 确认 runner 是 arm64
        run: |
          uname -m
          test "$(go env GOARCH)" = "arm64"

      # 默认构建必须与历史行为一致, 不能因为新增文件而受影响
      - name: 默认构建 (无 tag)
        run: go build ./...

      - name: 默认测试 (无 tag)
        run: go test ./...

      # go vet 能抓出汇编的 ABI 声明错误 (TEXT 的帧大小),
      # 这类问题运行时测试发现不了。
      #
      # 过滤掉 antlabs_mask_fast.go 里既有的 unsafe.Pointer 警告:
      # 那是本次改动之前就存在的, 与 NEON 无关, 不应让 CI 变红。
      # 其余任何 vet 发现都必须让 CI 失败。
      - name: go vet (带 tag)
        run: |
          # 一并过滤 go vet 输出的包名标题行(# / # [..]), 否则会被误判为问题
          out=$(go vet -tags wsutil_neon ./mask/ 2>&1 \
                | grep -v 'antlabs_mask_fast.go' \
                | grep -vE '^#( \[)?' || true)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
          echo "vet 通过"

      - name: 构建 (带 tag)
        run: go build -tags wsutil_neon ./...

      - name: 测试 (带 tag)
        run: go test -tags wsutil_neon ./mask/ -v

      - name: race 检测 (带 tag)
        run: go test -tags wsutil_neon -race ./mask/

      # 在多种运行时配置下跑(关闭抢占/极端 GC 频率/不同 GOMAXPROCS 等)。
      # 这些组合靠人工很难记得每次都跑, 所以固化成脚本。
      - name: 运行时配置矩阵 (chaos_env.sh)
        run: ./mask/chaos_env.sh

      # 在 x86 上带 tag 构建, 证明平台约束确实把 NEON 挡在外面
      - name: 交叉构建 darwin/amd64 (带 tag, 应回退)
        run: GOOS=darwin GOARCH=amd64 go build -tags wsutil_neon ./...

      - name: 交叉构建 linux/arm64 (带 tag, 应回退)
        run: GOOS=linux GOARCH=arm64 go build -tags wsutil_neon ./...
